[workspace]
resolver = "2"
members = [
  "crates/aeroshell-ipc",
  "crates/aeroshell-auth",
  "crates/aeroshell-services",
  "crates/aeroshell-apps",
  "crates/aeroshell-compositor",
  "crates/aeroshell-shell",
  "crates/aeroshell-lock",
  "crates/aeroshell-greeter",
  "crates/aeroshell-frame-client",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
  "backend_winit",
  "wayland_frontend",
  "desktop",
  "renderer_gl",
] }
calloop = "=0.14.5"
rustix = { version = "=1.1.6", features = ["process"] }
wayland-scanner = "0.31"
wayland-server = "0.31"
wayland-backend = "0.3"
bitflags = "2"
wayland-client = "0.31"
cairo-rs = "0.22"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ts-rs 12.0.1 (MIT): gera os bindings TS a partir dos tipos do IPC, sem copiá-los à mão.
# Alternativa descartada: declarar as interfaces TS manualmente (geraria divergência silenciosa).
ts-rs = "12.0.1"
